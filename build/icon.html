<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; }
      .icon {
        width: 512px; height: 512px; border-radius: 116px;
        background:
          radial-gradient(120% 120% at 18% 8%, rgba(255,255,255,0.35) 0%, transparent 45%),
          linear-gradient(145deg, #7c5cff 0%, #5b7cfa 52%, #22d3ee 100%);
        display: grid; place-items: center;
        box-shadow: inset 0 0 0 6px rgba(255,255,255,0.16);
        font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
        font-weight: 700; font-size: 196px; letter-spacing: -0.06em;
        color: #08080c;
      }
      .icon span { transform: translateY(-6px); }
    </style>
  </head>
  <body>
    <div class="icon"><span>FF</span></div>
  </body>
</html>
